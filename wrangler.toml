[triggers]
# Every minute: auto-live kickoff check. 00:00 UTC (01:00 WAT): daily big-game
# picker — right after midnight, so the new day's games are set as the date changes.
# Hourly at :05: GA4 visitor/partner analytics sync.
crons = ["* * * * *", "0 0 * * *", "5 * * * *"]

